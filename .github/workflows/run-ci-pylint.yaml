name: run-ci pylint

on:
    push:
        paths:
            - '.build/run-ci'
            - '.github/workflows/run-ci-pylint.yaml'
    pull_request:
        paths:
            - '.build/run-ci'
            - '.github/workflows/run-ci-pylint.yaml'

jobs:
    pylint-run-ci:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.11'

          - name: Install dependencies
            run: |
              python -m pip install --upgrade pip
              pip install pylint
              pip install -r .build/run-ci.d/requirements.txt

          - name: Run pylint on .build/run-ci
            run: pylint --disable=C0301,W0511,C0103,W0702,C0415,C0116,C0115,R0914,W0603,R0915,R0913,R0911,R0917 .build/run-ci
