name: CI Check

# Checks the CI tooling itself: the run-ci script and everything under .jenkins/
# Nothing here touches a k8s cluster; the helm and groovy steps only render and parse.

on:
    push:
        branches:
            - '**'
        paths:
            - '.build/run-ci'
            - '.build/run-ci.d/**'
            - '.build/ci/**'
            - '.jenkins/**'
            - '.github/workflows/jenkins-check.yaml'
    pull_request:
        paths:
            - '.build/run-ci'
            - '.build/run-ci.d/**'
            - '.build/ci/**'
            - '.jenkins/**'
            - '.github/workflows/jenkins-check.yaml'

jobs:
    run-ci:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Python 3
            uses: actions/setup-python@v5
            with:
              python-version: '3.x'
          - name: Install dependencies
            run: pip install pylint -r .build/run-ci.d/requirements.txt -r .build/ci/requirements.txt
          - name: Lint run-ci
            run: pylint --disable=C0301,C0302,W0511,C0103,W0702,C0415,C0116,C0115,R0914,W0603,R0915,R0913,R0917,R0911,W0212,W0621 .build/run-ci
          - name: Run run-ci unit tests
            run: python .build/run-ci.d/run-ci-test.py
          - name: Test CI report totals
            run: python .build/ci/ci_parser_test.py
          - name: Check run-ci argument parsing
            run: python .build/run-ci --help

    jenkins-validate:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Python 3
            uses: actions/setup-python@v5
            with:
              python-version: '3.x'
          - name: Install dependencies
            run: pip install pyyaml
          # get-helm-3 defaults to the latest stable release (now helm 4), so pin the version explicitly.
          - name: Helm
            env:
              DESIRED_VERSION: v3.21.3
            run: curl -fsSL https://raw.githubusercontent.com/helm/helm/v3.21.3/scripts/get-helm-3 | bash
          # validate.sh runs groovy from docker when it is not on the PATH
          - name: Validate .jenkins/
            run: .jenkins/k8s/jenkins-test.sh

    # The cloud directories under .jenkins/k8s check themselves, and `make test` is the whole offline half:
    # tofu fmt, tofu validate, and the regression suites for every script in them. No credentials, no
    # cluster, and no cloud API: each suite stubs the CLI it calls.
    k8s-cloud-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Python 3
            uses: actions/setup-python@v5
            with:
              python-version: '3.x'
          - name: Install dependencies
            run: pip install pyyaml
          # Pinned to a floor rather than to the newest release, so that this job checks the version the
          # configuration claims to support. A feature needing a later one then fails here, where the answer is
          # to raise the floor, rather than on an operator's machine.
          #
          # 1.10.0 is eks/1-cluster/versions.tf's floor and gke/1-cluster/versions.tf's is 1.9.0, so this
          # satisfies both and checks neither at its own floor. It is the higher of the two deliberately: one
          # runner cannot install two versions, and the alternative is a second job for the sake of one minor
          # version. What that costs is that a gke/ change relying on a 1.10 feature passes here and fails for
          # somebody on 1.9; raise gke's floor to 1.10 rather than lowering this pin if that ever happens.
          - name: OpenTofu
            uses: opentofu/setup-opentofu@v1
            with:
              tofu_version: 1.10.0
          - name: Test .jenkins/k8s/eks
            run: make -C .jenkins/k8s/eks test
          - name: Test .jenkins/k8s/gke
            run: make -C .jenkins/k8s/gke test
